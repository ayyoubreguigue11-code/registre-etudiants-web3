name: Deploiement controle sur Sepolia

on:
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: sepolia
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Compiler et tester
        run: |
          npm run compile
          npm test

      - name: Deployer sur Sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: npm run deploy:sepolia

      - name: Conserver la preuve de deploiement
        uses: actions/upload-artifact@v4
        with:
          name: preuve-deploiement-sepolia
          path: deployments/sepolia.json
